name: tijori
description: "Jewellery Girvi (Pawn/Loan), Karigar, & Accounting ERP — Offline-First"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Local Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.30

  # Key-Value & Security
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Remote Control Plane (Auth & License ONLY)
  supabase_flutter: ^2.10.0

  # OTA Updater
  dio: ^5.8.0+1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  open_filex: ^4.6.0

  # Printing & PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  sqlite3: ^2.9.4
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.25.0
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_lint: ^2.6.5
  mockito: ^5.4.6

flutter:
  uses-material-design: true

  # fonts:
  #   - family: TijoriIcons
  #     fonts:
  #       - asset: assets/fonts/TijoriIcons.ttf
